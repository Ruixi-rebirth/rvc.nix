name: Update flake inputs

on:
  workflow_dispatch:
  schedule:
    # Weekly, Monday 06:00 UTC
    - cron: "0 6 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  lockfile:
    name: Update the flake.lock inputs
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@527f17dd63d2d60d3e5552934bc84b9a33a14d11 # v3.22.2

      - name: Update flake.lock
        # `rvc-src` is deliberately excluded: the upstream RVC revision is
        # updated only through the reviewed process in CONTRIBUTING.md.
        run: >-
          nix flake update
          nixpkgs
          flake-parts
          treefmt-nix
          pyproject-nix
          uv2nix
          pyproject-build-systems

      - name: Create pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: update_flake_lock_action
          delete-branch: true
          add-paths: flake.lock
          commit-message: "flake.lock: Update"
          title: "Update flake inputs"
          body: "Automated weekly update of the repository's flake inputs."
