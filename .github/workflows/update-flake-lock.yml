name: Update flake inputs

on:
  workflow_dispatch:
  schedule:
    # Weekly, Monday 06:00 UTC
    - cron: "0 6 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  lockfile:
    name: Update the flake.lock inputs
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@527f17dd63d2d60d3e5552934bc84b9a33a14d11 # v3.22.2

      - name: Update flake.lock
        uses: DeterminateSystems/update-flake-lock@a2bbe0274e3a0c4194390a1e445f734c597ebc37 # v24
        with:
          pr-title: "Update flake inputs"
          # `rvc-src` is deliberately excluded: the upstream RVC revision is
          # updated only through the reviewed process in CONTRIBUTING.md.
          inputs: nixpkgs flake-parts treefmt-nix pyproject-nix uv2nix pyproject-build-systems
